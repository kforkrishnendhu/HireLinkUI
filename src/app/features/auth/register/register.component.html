<div class="min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-bold text-center text-gray-800" *ngIf="role === 'JobSeeker'">Sign Up as Job Seeker</h2>
        <h2 class="text-2xl font-bold text-center text-gray-800" *ngIf="role === 'Company'">Register as a Company</h2>


        <form [formGroup]="registerForm" (ngSubmit)="register()" class="mt-4 space-y-4">
            <!-- Full Name -->
            <div>
                <label class="block text-gray-700 font-medium">Full Name</label>
                <input type="text" formControlName="fullName"
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
                <div *ngIf="submitted && f['fullName'].invalid" class="text-red-500 font-semibold mt-1">
                    <span *ngIf="f['fullName'].errors?.['required']">Full Name is required.</span>
                </div>
            </div>
        
            <!-- Email -->
            <div>
                <label class="block text-gray-700 font-medium">Email</label>
                <input type="email" formControlName="email"
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
                <div *ngIf="submitted && f['email'].invalid" class="text-red-500 font-semibold mt-1">
                    <span *ngIf="f['email'].errors?.['required']">Email is required.</span>
                    <span *ngIf="f['email'].errors?.['email']">Invalid email format.</span>
                </div>
            </div>
        
            <!-- Password -->
            <div>
                <label class="block text-gray-700 font-medium">Password</label>
                <input type="password" formControlName="password"
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
                <div *ngIf="submitted && f['password'].invalid" class="text-red-500 font-semibold mt-1">
                    <span *ngIf="f['password'].errors?.['required']">Password is required.</span>
                    <span *ngIf="f['password'].errors?.['minlength']">Password must be at least 6 characters.</span>
                </div>
            </div>
        
            <!-- Submit Button -->
            <button type="submit"
                class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 rounded-lg transition">
                Register
            </button>
        
            <p *ngIf="submitted && registerForm.invalid" class="text-red-500 font-semibold mt-2">
                Please fill in all required fields correctly.
            </p>
            <div *ngIf="errorMessage" class="text-red-500 font-semibold mt-2">
                {{ errorMessage }}
              </div>
        </form>
        

        <!-- Login Redirect -->
        <p class="mt-4 text-center text-gray-600">
            Already have an account?
            <a routerLink="auth/login" class="text-blue-500 hover:underline">Login</a>
        </p>
    </div>
</div>
