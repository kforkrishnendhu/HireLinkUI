<div class="max-w-3xl mx-auto bg-white shadow-lg rounded-lg p-6">
    <h2 class="text-xl font-semibold text-gray-700 mb-4">Edit Company Profile</h2>

    <form [formGroup]="profileForm" (ngSubmit)="submitForm()" class="space-y-4">
        
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label for="companyName" class="block text-sm font-medium text-gray-700">Company Name</label>
                <input id="companyName" type="text" formControlName="companyName" class="input-field" />
                <div *ngIf="profileForm.get('companyName')?.invalid && (profileForm.get('companyName')?.touched || profileForm.get('companyName')?.dirty)"
                    class="text-red-500 text-sm">
                    <div *ngIf="profileForm.get('companyName')?.errors?.['required']">
                        Company Name is required.
                    </div>
                </div>
            </div>
            <div>
                <label for="industry" class="block text-sm font-medium text-gray-700">Industry</label>
                <input id="industry" type="text" formControlName="industry" class="input-field" />
                <div *ngIf="profileForm.get('industry')?.invalid && (profileForm.get('industry')?.touched || profileForm.get('industry')?.dirty)"
                    class="text-red-500 text-sm">
                    <div *ngIf="profileForm.get('industry')?.errors?.['required']">
                        Industry is required.
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label for="website" class="block text-sm font-medium text-gray-700">Website</label>
                <input id="website" type="text" formControlName="website" class="input-field" />
                <div *ngIf="profileForm.get('website')?.invalid && (profileForm.get('website')?.touched || profileForm.get('website')?.dirty)"
                    class="text-red-500 text-sm">
                    <div *ngIf="profileForm.get('website')?.errors?.['required']">
                        Website is required.
                    </div>
                    <div *ngIf="profileForm.get('website')?.errors?.['pattern']">
                        Enter a valid URL (starts with http:// or https://).
                    </div>
                </div>
            </div>
            <div>
                <label for="location" class="block text-sm font-medium text-gray-700">Location</label>
                <input id="location" type="text" formControlName="location" class="input-field" />
                <div *ngIf="profileForm.get('location')?.invalid && profileForm.get('location')?.touched" class="text-red-500 text-sm">
                    Location is required.
                  </div>
            </div>
        </div>

        
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label for="companySize" class="block text-sm font-medium text-gray-700">Company Size</label>
                <input id="companySize" type="text" formControlName="companySize" class="input-field" />
                <div *ngIf="profileForm.get('companySize')?.invalid && profileForm.get('companySize')?.touched" class="text-red-500 text-sm">
                    Company Size is required.
                  </div>
            </div>
            <div>
                <label for="workingDays" class="block text-sm font-medium text-gray-700">Working Days</label>
                <input id="workingDays" type="text" formControlName="workingDays" class="input-field" />
            </div>
        </div>

        <div>
            <label for="aboutCompany" class="block text-sm font-medium text-gray-700">About Company</label>
            <textarea id="aboutCompany" formControlName="aboutCompany" class="input-field"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
            
            <div>
                <label for="companyLogo" class="block text-sm font-medium text-gray-700">Company Logo</label>
                <input id="companyLogo" type="file" (change)="onImageChange($event, 'logo')" class="block w-full text-sm text-gray-500"
                    [disabled]="isUploadingLogo" />

                <div *ngIf="isUploadingLogo" class="mt-1 flex items-center gap-2 text-blue-500 text-sm">
                    <span
                        class="inline-block h-4 w-4 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></span>
                    Uploading...
                </div>

                <img *ngIf="companyLogoPreview && !isUploadingLogo" [src]="companyLogoPreview" alt="Company logo preview"
                    class="mt-2 h-20 w-20 rounded-md shadow-md transition-opacity duration-500 ease-in opacity-0"
                    (load)="imageLoaded($event)" />
            </div>

            <div>
                <label for="backgroundImage" class="block text-sm font-medium text-gray-700">Background Image</label>
                <input id="backgroundImage" type="file" (change)="onImageChange($event, 'background')"
                    class="block w-full text-sm text-gray-500" [disabled]="isUploadingBackground" />

                <div *ngIf="isUploadingBackground" class="mt-1 flex items-center gap-2 text-blue-500 text-sm">
                    <span
                        class="inline-block h-4 w-4 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></span>
                    Uploading...
                </div>


                <img *ngIf="backgroundDpPreview && !isUploadingBackground" [src]="backgroundDpPreview" alt="Background Dp Preview"
                    class="mt-2 h-20 w-full rounded-md shadow-md transition-opacity duration-500 ease-in opacity-0"
                    (load)="imageLoaded($event)" />
            </div>
        </div>

        <button type="submit" 
            class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">
            Save Changes
        </button>
    </form>
</div>
