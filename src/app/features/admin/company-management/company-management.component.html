
<div class="container mx-auto p-6">
    <!-- Heading and Add User Button -->
    <h1 class="text-2xl font-semibold">Company Management</h1>
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-semibold"></h1>
      <button 
      class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 flex items-center gap-2"
      (click)="openAddCompanyModal()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      <span>Add Company</span>
    </button>
    </div>
  
    <!-- Search Bar -->
    <div class="mb-4">
      <input 
        type="text"
        placeholder="Search Company..."
        [(ngModel)]="searchQuery"
        (input)="filterCompanies()"
        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
      />
    </div>
  
    <!-- Job Seekers Table -->
    <div class="overflow-x-auto">
      <table class="min-w-full border rounded-lg">
        <thead>
          <tr class="bg-gray-200 text-gray-700">
            <th class="px-4 py-2 text-left">Company Id</th>
            <th class="px-4 py-2 text-left">Name</th>
            <th class="px-4 py-2 text-left">Email</th>
            <th class="px-4 py-2 text-left">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let seeker of filteredCompanies; trackBy: trackById" class="border-b">
            <td class="px-4 py-2">{{ seeker.userId }}</td>
            <td class="px-4 py-2">{{ seeker.fullName }}</td>
            <td class="px-4 py-2">{{ seeker.email }}</td>
            <td class="px-4 py-2 space-x-2">
                <button class="text-blue-500 hover:text-blue-700" (click)="viewUser(seeker.userId)">
                    👁️
                  </button>
                  <button class="text-red-500 hover:text-red-700" (click)="deleteUser(seeker.userId)">
                    ❌
                  </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>


<!-- View User Modal -->
<app-modal [title]="'Job Seeker Details'" [isOpen]="isViewModalOpen" (closeModal)="isViewModalOpen = false">
    <p><strong>Name:</strong> {{ selectedCompany?.fullName }}</p>
    <p><strong>Email:</strong> {{ selectedCompany?.email }}</p>
  </app-modal>
  
  <!-- Delete Confirmation Modal -->
  <app-modal [title]="'Confirm Deletion'" [isOpen]="isDeleteModalOpen" (closeModal)="isDeleteModalOpen = false">
    <p>Are you sure you want to delete <strong>{{ selectedCompany?.fullName }}</strong>?</p>
    <div class="flex justify-end gap-4 mt-4">
      <button class="bg-gray-300 px-4 py-2 rounded" (click)="isDeleteModalOpen = false">Cancel</button>
      <button class="bg-red-500 text-white px-4 py-2 rounded" (click)="confirmDelete()">Delete</button>
    </div>
  </app-modal>

 <!-- Reusable Modal for Adding Company -->
 <app-modal [title]="'Add company'" [isOpen]="isAddModalOpen" (closeModal)="isAddModalOpen = false">
    <div class="space-y-4">
      <input type="text" placeholder="Company Name" [(ngModel)]="companyName" class="w-full p-2 border rounded" />
      <input type="email" placeholder="Company Email" [(ngModel)]="companyEmail" class="w-full p-2 border rounded" />
      <!-- <input type="text" placeholder="Company Website" [(ngModel)]="companyWebsite" class="w-full p-2 border rounded" /> -->

      <div class="flex justify-end space-x-2">
        <button class="px-4 py-2 bg-gray-500 text-white rounded" (click)="isAddModalOpen = false">Cancel</button>
        <button class="px-4 py-2 bg-blue-500 text-white rounded" (click)="submitCompany()">Add</button>
      </div>
    </div>
  </app-modal>
