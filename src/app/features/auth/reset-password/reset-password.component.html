<div class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="bg-white p-6 rounded-lg shadow-lg w-96">
      <h2 class="text-2xl font-bold mb-4 text-center">Reset Password</h2>
  
      <!-- Show error message if token is invalid -->
      <div *ngIf="!isTokenValid" class="text-red-500 text-center">
        {{ errorMessage }}
      </div>
  
      <!-- Show form if token is valid -->
      <form *ngIf="isTokenValid" [formGroup]="resetForm" (ngSubmit)="onSubmit()">
        <!-- Password -->
        <div>
          <label for="newPassword" class="block text-gray-700 font-medium">Password</label>
          <input 
            id="newPassword"
            type="password" 
            formControlName="newPassword" 
            appPasswordValidator
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <div *ngIf="f['newPassword'].invalid" class="text-red-500 font-semibold mt-1">
            <span *ngIf="f['newPassword'].errors?.['required']">Password is required.</span>
            <span *ngIf="f['newPassword'].errors?.['minlength']">Password must be at least 6 characters.</span>
            <span *ngIf="f['newPassword'].errors?.['strongPassword']">
              Password must include uppercase, lowercase, number, and special character.
            </span>
          </div>
        </div>
  
        <!-- Confirm Password -->
        <div>
          <label for="confirmPassword" class="block text-gray-700 font-medium">Confirm Password</label>
          <input
            id="confirmPassword" 
            type="password" 
            formControlName="confirmPassword" 
            appMustMatch="['newPassword', 'confirmPassword']"
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <div *ngIf="f['confirmPassword'].invalid" class="text-red-500 font-semibold mt-1">
            <span *ngIf="f['confirmPassword'].errors?.['required']">Confirm Password is required.</span>
            <span *ngIf="f['confirmPassword'].errors?.['mustMatch']">Passwords must match.</span>
          </div>
        </div>
  
        <button 
          type="submit" 
          class="w-full bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600 transition"
          [disabled]="resetForm.invalid"
        >
          Reset Password
        </button>
      </form>
    </div>
  </div>
