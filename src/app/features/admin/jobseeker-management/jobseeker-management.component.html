<div class="container mx-auto p-6">
  <!-- Heading and Add User Button -->
  <h1 class="text-2xl font-semibold">Job Seeker Management</h1>
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-2xl font-semibold">Job Seeker Management</h1>
    <button class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 flex items-center gap-2"
      (click)="addUser()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
        class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      <span>Add User</span>
    </button>
  </div>

  <!-- Search Bar -->
  <div class="mb-4">
    <input type="text" placeholder="Search Job Seekers..." (input)="onSearchInput($event)"
      class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" />
  </div>

  <!-- Reusable Table Component -->
  <app-table [columns]="columns" [data]="filteredJobSeekers" [actions]="actions"
    (actionClick)="handleTableAction($event)">
  </app-table>

  <!-- Pagination Controls -->
  <div class="flex justify-center items-center mt-4 space-x-2">
    <button class="px-4 py-2 bg-gray-300 rounded" (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 1">
      Previous
    </button>

    <span class="px-4 py-2">Page {{ currentPage }} of {{ totalPages() }}</span>

    <button class="px-4 py-2 bg-gray-300 rounded" (click)="goToPage(currentPage + 1)"
      [disabled]="currentPage >= totalPages()">
      Next
    </button>
  </div>

</div>


<!-- View User Modal -->
<app-modal [title]="'Job Seeker Details'" [isOpen]="isViewModalOpen" (closeModal)="isViewModalOpen = false">
  <p><strong>Name:</strong> {{ selectedJobSeeker?.fullName }}</p>
  <p><strong>Email:</strong> {{ selectedJobSeeker?.email }}</p>
</app-modal>

<!-- Delete Confirmation Modal -->
<app-modal [title]="'Confirm Deletion'" [isOpen]="isDeleteModalOpen" (closeModal)="isDeleteModalOpen = false">
  <p>Are you sure you want to delete <strong>{{ selectedJobSeeker?.fullName }}</strong>?</p>
  <div class="flex justify-end gap-4 mt-4">
    <button class="bg-gray-300 px-4 py-2 rounded" (click)="isDeleteModalOpen = false">Cancel</button>
    <button class="bg-red-500 text-white px-4 py-2 rounded" (click)="confirmDelete()">Delete</button>
  </div>
</app-modal>
