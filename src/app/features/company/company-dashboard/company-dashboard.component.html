
<main class="w-full flex justify-center items-center bg-gray-100">
    <div class="flex flex-col items-center justify-center p-6 w-full max-w-2xl">
        <div class="bg-white shadow-md rounded-lg p-8 w-full max-w-2xl text-center">
            <h1 class="text-3xl font-bold text-blue-600">Welcome, {{username}}!</h1>
            <p class="mt-2 text-gray-600">Find the best Candidate here.</p>
    
            <div class="mt-6 flex flex-col space-y-4">
                <a routerLink="/jobs" class="bg-blue-500 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition">
                    Browse Candidates
                </a>
                <a routerLink="/profile" class="bg-gray-500 text-white px-6 py-3 rounded-lg hover:bg-gray-700 transition">
                    View Profile
                </a>
                <a routerLink="/jobs/job-list"
                    class="bg-green-500 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition">
                    Job Posts
                </a>
            </div>
        </div>
    </div>

</main>
