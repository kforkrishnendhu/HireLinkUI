
<div class="container mx-auto p-6">
    <!-- Heading and Add User Button -->
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-semibold">Job Seeker Management</h1>
      <button 
        class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600"
        (click)="addUser()"
      >
        Add User
      </button>
    </div>
  
    <!-- Search Bar -->
    <div class="mb-4">
      <input 
        type="text"
        placeholder="Search Job Seekers..."
        [(ngModel)]="searchQuery"
        (input)="filterJobSeekers()"
        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
      />
    </div>
  
    <!-- Job Seekers Table -->
    <div class="overflow-x-auto">
      <table class="min-w-full border rounded-lg">
        <thead>
          <tr class="bg-gray-200 text-gray-700">
            <th class="px-4 py-2 text-left">Name</th>
            <th class="px-4 py-2 text-left">Email</th>
            <th class="px-4 py-2 text-left">Phone</th>
            <th class="px-4 py-2 text-left">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let seeker of filteredJobSeekers" class="border-b">
            <td class="px-4 py-2">{{ seeker.name }}</td>
            <td class="px-4 py-2">{{ seeker.email }}</td>
            <td class="px-4 py-2">{{ seeker.phone }}</td>
            <td class="px-4 py-2 space-x-2">
              <button 
                class="bg-green-500 text-white px-3 py-1 rounded hover:bg-green-600"
                (click)="editUser(seeker.id)"
              >
                Edit
              </button>
              <button 
                class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600"
                (click)="deleteUser(seeker.id)"
              >
                Delete
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
