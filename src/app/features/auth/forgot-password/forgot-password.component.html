<div class="flex min-h-[calc(100vh-4rem)] w-full items-center justify-center bg-gray-100 px-4">
    <div class="w-full max-w-md bg-white p-6 rounded-2xl shadow-lg">
      <h2 class="text-2xl font-semibold text-center text-gray-800 mb-4">
        Forgot Password
      </h2>
      <p class="text-gray-600 text-sm text-center mb-6">
        Enter your email address and we'll send you a link to reset your password.
      </p>
  
      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
          <input 
            id="email"
            type="email"
            formControlName="email"
            class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring focus:ring-indigo-200 focus:outline-none"
            placeholder="Enter your email"
          />
          <div *ngIf="forgotPasswordForm.controls['email'].touched && forgotPasswordForm.controls['email'].invalid" class="text-red-500 text-sm mt-1">
            <span *ngIf="forgotPasswordForm.controls['email'].errors?.['required']">Email is required.</span>
            <span *ngIf="forgotPasswordForm.controls['email'].errors?.['email']">Enter a valid email.</span>
        </div>
        </div>
  
        <button
          type="submit"
          [disabled]="forgotPasswordForm.invalid"
          class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition disabled:opacity-50">
          Send Reset Link
        </button>
      </form>
  
      <p *ngIf="successMessage" class="text-green-600 text-sm mt-4 text-center">{{ successMessage }}</p>
      <p *ngIf="errorMessage" class="text-red-600 text-sm mt-4 text-center">{{ errorMessage }}</p>
  
      <div class="mt-4 text-center">
        <a routerLink="/auth/login" class="text-indigo-600 hover:underline text-sm">Back to Login</a>
      </div>
    </div>
  </div>
