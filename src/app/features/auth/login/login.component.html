<div class="min-h-screen flex items-center justify-center">
    <div class="bg-white shadow-md rounded px-8 py-6">
      <h2 class="text-2xl font-bold mb-4">Login</h2>
      <form (ngSubmit)="onSubmit()">
        <input class="border p-2 w-full" type="email" placeholder="Email" [(ngModel)]="email" name="email">
        <input class="border p-2 w-full mt-2" type="password" placeholder="Password" [(ngModel)]="password" name="password">
        <button class="bg-blue-500 text-white px-4 py-2 mt-4 w-full">Login</button>
      </form>
    </div>
  </div>
