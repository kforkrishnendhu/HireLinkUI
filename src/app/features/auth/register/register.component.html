<div class="min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-bold text-center text-gray-800" *ngIf="role === 'JobSeeker'">Sign Up as Job Seeker</h2>
        <h2 class="text-2xl font-bold text-center text-gray-800" *ngIf="role === 'Company'">Register as a Company</h2>


        <form (ngSubmit)="register()" class="mt-4 space-y-4">
            <!-- Full Name -->
            <div>
                <label class="block text-gray-700 font-medium">Full Name</label>
                <input type="text" [(ngModel)]="fullName" name="fullName" required
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <!-- Email -->
            <div>
                <label class="block text-gray-700 font-medium">Email</label>
                <input type="email" [(ngModel)]="email" name="email" required
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <!-- Password -->
            <div>
                <label class="block text-gray-700 font-medium">Password</label>
                <input type="password" [(ngModel)]="password" name="password" required
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>


            <!-- Submit Button -->
            <button type="submit"
                class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 rounded-lg transition">
                Register
            </button>
            <p *ngIf="errorMessage" class="text-red-500 font-semibold mt-2">{{ errorMessage }}</p>

        </form>

        <!-- Login Redirect -->
        <p class="mt-4 text-center text-gray-600">
            Already have an account?
            <a routerLink="auth/login" class="text-blue-500 hover:underline">Login</a>
        </p>
    </div>
</div>
