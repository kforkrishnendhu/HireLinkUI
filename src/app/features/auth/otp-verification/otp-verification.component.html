<div class="min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
      <h2 class="text-2xl font-bold mb-4">OTP Verification</h2>
      <form [formGroup]="otpForm" (ngSubmit)="verifyOtp()" class="mt-4 space-y-4">
        <p class="text-gray-600">Enter the OTP sent to <strong>{{ email }}</strong></p>
    
        <!-- OTP Input -->
        <div>
            <label for="otp" class="block text-gray-700 font-medium">Enter OTP</label>
            <input id="otp" type="text" formControlName="otp" maxlength="6"
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-center text-lg tracking-widest" />
            <div *ngIf="submitted && f['otp'].invalid" class="text-red-500 font-semibold mt-1">
                <span *ngIf="f['otp'].errors?.['required']">OTP is required.</span>
                <span *ngIf="f['otp'].errors?.['minlength'] || f['otp'].errors?.['maxlength']">OTP must be 6 digits.</span>
            </div>
        </div>
    
        <!-- Verify Button -->
        <button type="submit"
            class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 rounded-lg transition">
            Verify OTP
        </button>
    
        <!-- Countdown Timer & Resend OTP -->
        <div class="text-center mt-2">
            <p class="text-gray-600">
                Resend OTP in <span *ngIf="timerActive" class="font-semibold text-blue-600">{{ countdown }}s</span>
            </p>
            <button type="button" (click)="resendOtp()" [disabled]="timerActive"
                class="mt-2 px-4 py-2 rounded-lg font-semibold transition"
                [ngClass]="timerActive ? 'bg-gray-400 text-white' : 'bg-green-500 hover:bg-green-600 text-white'">
                Resend OTP
            </button>
        </div>
    
        <!-- Error Message -->
        <p *ngIf="errorMessage" class="text-red-500 font-semibold mt-2">
            {{ errorMessage }}
        </p>
    </form>
    
    
    </div>
</div>
